<main class="wrap">
  <div class="card">
    <h2>分租合法性清单：出租前先核实</h2>
    <p>分租能不能收两份租金，先看合法性，再看账。以下五项缺一项都别急着按分租价买。通用教育信息，仅供参考，具体以市政和专业人士意见为准。</p>
    <ol class="pack-list">
      <li><label><input type="checkbox"> 独立入口：下层有没有独立入口？还是必须穿过楼上进出？</label></li>
      <li><label><input type="checkbox"> 消防：烟感、防火分隔、逃生出口是否符合要求？有没有消防方面的书面确认？</label></li>
      <li><label><input type="checkbox"> 分区：该地址的分区允不允许第二套间？是已登记的合法套间，还是“可改成”而已？</label></li>
      <li><label><input type="checkbox"> 市政核实：向市政核实过套间状态和许可记录吗？有书面回复吗？不要只听挂牌广告词。</label></li>
      <li><label><input type="checkbox"> 保险与租约：保险公司知道是分租吗？租约、押金、水电分摊方式都写清楚了吗？</label></li>
    </ol>
    <h3>算账时再核三项</h3>
    <ol class="pack-list" start="6">
      <li><label><input type="checkbox"> 租金可信度：已租出价、挂牌要价、平台估算价，分清楚你用的是哪一种。</label></li>
      <li><label><input type="checkbox"> 空置和维修：用本站<a href="../#split">分租计算器</a>把空置预留和维修预留填进去，看净账。</label></li>
      <li><label><input type="checkbox"> 管理费和持有成本：公寓管理费、地税、保险都算进持有成本了吗？</label></li>
    </ol>
    <p class="small">本站内容仅供参考，不是投资建议、法律或税务意见。分租前请咨询市政、律师和保险顾问。</p>
