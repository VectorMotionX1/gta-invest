  <div class="card">
    <h2>翻新验收清单：比价、验收、留尾款</h2>
    <p>毛差不是净利润。买翻新房或自己翻新转手前，逐项核对。通用教育信息，仅供参考。</p>
    <ol class="pack-list">
      <li><label><input type="checkbox"> 真翻新还是化妆：换了厨房卫浴、屋顶、暖通和电路，还是只刷了漆、换了地板、摆了家具拍照？</label></li>
      <li><label><input type="checkbox"> 装修许可：需要许可的工程有许可记录吗？向市政核实过吗？</label></li>
      <li><label><input type="checkbox"> 同区比价：同区没翻新的同类房卖多少？翻新溢价有没有超过合理范围？</label></li>
      <li><label><input type="checkbox"> 验房：验房师看过屋顶、暖通、电路、水管、地基吗？有书面报告吗？</label></li>
      <li><label><input type="checkbox"> 账算全了吗：用本站<a href="../#flip">翻新计算器</a>把装修费、持有和税费、中介费、持有月数都填进去，看净利和年化。</label></li>
      <li><label><input type="checkbox"> 尾款：装修合同有没有留尾款、写明验收标准和完工时间？口头承诺不算。</label></li>
      <li><label><input type="checkbox"> 税务：12 个月内转手可能适用翻新转手规则，利润按生意收入计税，问过会计师吗？</label></li>
      <li><label><input type="checkbox"> 持有期：如果卖不掉，每个月持有成本多少？能扛几个月？</label></li>
    </ol>
    <p class="small">本站内容仅供参考，不是投资建议、法律或税务意见。翻新和转手前请咨询持牌专业人士。</p>
