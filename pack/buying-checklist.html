<main class="wrap">
  <div class="card">
    <h2>抄底检查清单：买之前先核对的 10 个问题</h2>
    <p>打印出来，出价前逐项打勾。有一项答不上来，就先别出价。通用教育信息，仅供参考。</p>
    <ol class="pack-list">
      <li><label><input type="checkbox"> “跌了很多”不等于“跌到底了”：这套房和同区同类房相比，现在到底贵还是便宜？有近期成交价支撑吗？</label></li>
      <li><label><input type="checkbox"> 持有成本算过吗：月供（加拿大半年复利）、地税、保险、管理费，四项加起来每月多少？用本站<a href="../#split">分租计算器</a>跑过吗？</label></li>
      <li><label><input type="checkbox"> 租金按保守数算过吗：已租出价、挂牌要价、平台估算价，三种可信度不一样，你用的是哪一种？</label></li>
      <li><label><input type="checkbox"> 空置和维修留了吗：空置预留和维修预留填进去之后，现金流还站得住吗？</label></li>
      <li><label><input type="checkbox"> 流动性想过吗：如果半年卖不掉，持有成本谁来扛？同区在市天数一般多久？</label></li>
      <li><label><input type="checkbox"> 买入价和卖出价之外，中介费、土地转让税、律师费、持有期利息都算进真实成本了吗？</label></li>
      <li><label><input type="checkbox"> 首付不到 20% 时，房贷保险的费用问过贷款顾问了吗？有书面数字吗？</label></li>
      <li><label><input type="checkbox"> 退出计划是什么：自住、分租、翻新转手，哪一条？每条的税和规则问过会计师和律师吗？</label></li>
      <li><label><input type="checkbox"> 所有关键数字有书面来源吗：银行、经纪、律师、市政，而不是口头数字或挂牌广告词？</label></li>
      <li><label><input type="checkbox"> 最坏情况能接受吗：如果房价再跌一成、租金空三个月，这笔账还扛得住吗？</label></li>
    </ol>
    <p class="small">本站内容仅供参考，不是投资建议、法律或税务意见。买卖前请咨询持牌专业人士。</p>
